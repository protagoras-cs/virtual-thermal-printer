name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  binary:
    name: Build binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: virtual-thermal-printer-linux
          - os: macos-latest
            binary: virtual-thermal-printer-macos
          - os: windows-latest
            binary: virtual-thermal-printer-windows.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Windows Rollup binary
        if: runner.os == 'Windows'
        run: npm install --no-save --package-lock=false @rollup/rollup-win32-x64-msvc@4.60.2

      - name: Build
        run: npm run build

      - name: Create SEA bundle
        working-directory: packages/virtual-thermal-printer
        run: npm run sea:bundle

      - name: Create SEA blob
        working-directory: packages/virtual-thermal-printer
        run: node --experimental-sea-config sea-config.json

      - name: Copy node binary (Linux / macOS)
        if: runner.os != 'Windows'
        working-directory: packages/virtual-thermal-printer
        run: cp $(node -e "process.stdout.write(process.execPath)") ${{ matrix.binary }}

      - name: Copy node binary (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/virtual-thermal-printer
        shell: pwsh
        run: Copy-Item (node -e "process.stdout.write(process.execPath)") ${{ matrix.binary }}

      - name: Remove macOS signature
        if: runner.os == 'macOS'
        working-directory: packages/virtual-thermal-printer
        run: codesign --remove-signature ${{ matrix.binary }}

      - name: Inject SEA blob
        working-directory: packages/virtual-thermal-printer
        run: npx postject ${{ matrix.binary }} NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Sign binary (macOS)
        if: runner.os == 'macOS'
        working-directory: packages/virtual-thermal-printer
        run: codesign --sign - ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: packages/virtual-thermal-printer/${{ matrix.binary }}

      - name: Set up .NET
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows desktop app
        if: runner.os == 'Windows'
        run: dotnet publish desktop-app/VirtualThermalPrinterDesktop.csproj -c Release -r win-x64 --self-contained true -o desktop-app/publish

      - name: Upload Windows desktop app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app-publish
          path: desktop-app/publish/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [binary]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          pattern: virtual-thermal-printer-*
          path: server-artifacts

      - name: Download Windows desktop app
        uses: actions/download-artifact@v4
        with:
          name: desktop-app-publish
          path: desktop-app-publish

      - name: Package Windows desktop app
        run: |
          mkdir -p desktop-bundle artifacts
          cp -R desktop-app-publish/. desktop-bundle/
          cp server-artifacts/virtual-thermal-printer-windows.exe/virtual-thermal-printer-windows.exe desktop-bundle/
          zip -r artifacts/VirtualThermalPrinterDesktop-win-x64.zip desktop-bundle

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --repo "$REPOSITORY" --title "Release $TAG_NAME"
          else
            gh release create "$TAG_NAME" \
              --repo "$REPOSITORY" \
              --title "Release $TAG_NAME" \
              --generate-notes
          fi

          assets=(server-artifacts/*/* artifacts/VirtualThermalPrinterDesktop-win-x64.zip)
          gh release upload "$TAG_NAME" "${assets[@]}" --repo "$REPOSITORY" --clobber
